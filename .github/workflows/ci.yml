name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint ve testler
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rapidquiz
          POSTGRES_USER: rapidquiz
          POSTGRES_PASSWORD: rapidquiz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rapidquiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgres://rapidquiz:rapidquiz@localhost:5432/rapidquiz
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Bağımlılıklar
        run: uv sync --frozen
      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Eksik migration kontrolü
        run: uv run manage.py makemigrations --check --dry-run
      - name: Soru dosyaları
        run: uv run manage.py load_questions --check
      - name: OpenAPI şeması (uyarısız)
        run: uv run manage.py spectacular --validate --fail-on-warn --file schema.yml
      - name: Testler
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: schema.yml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rapid-quiz-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
