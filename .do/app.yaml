# Rapid Quiz — DigitalOcean App Platform spec (backend + frontend tek uygulamada).
#
# Tek uygulama, tek adres: /api, /admin, /static → Django (api); diğer her şey → Vue (web).
# Aynı köken olduğu için CORS gerekmez ve frontend API'ye göreli adresle (/api/v1) gider.
# Kurulum adımları: docs/deploy.md
#
# __DJANGO_SECRET_KEY__ yer tutucusu dosyada BIRAKILIR; uygulama oluşturulurken geçici bir
# kopyada gerçek değerle değiştirilir (docs/deploy.md › 5). DO, SECRET değerleri şifreleyerek saklar.
name: rapid-quiz
region: fra

envs:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.prod
  - key: DJANGO_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
    value: __DJANGO_SECRET_KEY__
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db.DATABASE_URL}

services:
  - name: api
    github:
      repo: busracankit/RapidQuizBackend
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/v1/health/
      initial_delay_seconds: 10
      period_seconds: 10
    envs:
      - key: DJANGO_ALLOWED_HOSTS
        value: ${APP_DOMAIN}
      - key: CSRF_TRUSTED_ORIGINS
        value: https://${APP_DOMAIN}
      - key: WEB_CONCURRENCY
        value: "3"

static_sites:
  - name: web
    github:
      repo: busracankit/RapidQuizFrontend
      branch: main
      deploy_on_push: true
    # Node sürümü package.json › engines (24.x) ile seçilir.
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html   # Vue Router history mode
    # VITE_API_BASE_URL tanımlanmaz: API aynı adreste, istemci /api/v1'e gider.

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /admin
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /static
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: busracankit/RapidQuizBackend
      branch: main
    dockerfile_path: Dockerfile
    # Migration + soruların senkronu (load_questions idempotent). Hata olursa deploy durur.
    run_command: sh -c "python manage.py migrate --noinput && python manage.py load_questions"
    instance_size_slug: apps-s-1vcpu-0.5gb
  - name: cleanup-sessions
    kind: SCHEDULED
    schedule:
      cron: "0 4 * * *"
      time_zone: Europe/Istanbul
    github:
      repo: busracankit/RapidQuizBackend
      branch: main
    dockerfile_path: Dockerfile
    run_command: python manage.py cleanup_sessions
    instance_size_slug: apps-s-1vcpu-0.5gb

databases:
  - name: db
    engine: PG
    version: "18"
    production: true
    cluster_name: rapid-quiz-db   # docs/deploy.md › 4'te oluşturulan Managed PostgreSQL 18 kümesi
