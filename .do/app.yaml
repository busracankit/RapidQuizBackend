name: rapid-quiz-api
region: fra
domains:
  - domain: api.rapidquiz.app
    type: PRIMARY
envs:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.prod
  - key: DJANGO_SECRET_KEY
    scope: RUN_TIME
    type: SECRET            # değer panelden girilir
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db.DATABASE_URL}
services:
  - name: api
    github:
      repo: <github-kullanici>/rapid-quiz-backend
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/v1/health/
      initial_delay_seconds: 10
      period_seconds: 10
    envs:
      - key: DJANGO_ALLOWED_HOSTS
        value: api.rapidquiz.app,${APP_DOMAIN}
      - key: CORS_ALLOWED_ORIGINS
        value: https://rapidquiz.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api.rapidquiz.app
      - key: WEB_CONCURRENCY
        value: "3"
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: <github-kullanici>/rapid-quiz-backend
      branch: main
    dockerfile_path: Dockerfile
    run_command: python manage.py migrate --noinput
    instance_size_slug: apps-s-1vcpu-0.5gb
  - name: cleanup-sessions
    kind: SCHEDULED
    schedule:
      cron: "0 4 * * *"
      time_zone: Europe/Istanbul
    github:
      repo: <github-kullanici>/rapid-quiz-backend
      branch: main
    dockerfile_path: Dockerfile
    run_command: python manage.py cleanup_sessions
    instance_size_slug: apps-s-1vcpu-0.5gb
databases:
  - name: db
    engine: PG
    version: "18"
    production: true
    cluster_name: rapid-quiz-db
