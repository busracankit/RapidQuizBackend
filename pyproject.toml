[project]
name = "rapid-quiz-backend"
version = "0.1.0"
description = "Rapid Quiz REST API (Django + DRF)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django==6.1.1",
    "djangorestframework==3.18.1",
    "drf-spectacular==0.30.0",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.6",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    "drf-spectacular-sidecar==2026.10.1",
]

[dependency-groups]
dev = [
    "pytest==9.*",
    "pytest-django==4.14.0",
    "pytest-cov",
    "time-machine==3.5.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:No directory at:UserWarning",
]
testpaths = ["apps", "config"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "W"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
